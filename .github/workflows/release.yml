name: Release

# A commit on main whose CI passed, and whose Cargo.toml version has no tag yet, is a release:
# v<version> is tagged on that commit, and the binary, its specs, its deploy files and its licence
# are published, attested, as an immutable GitHub Release and as ghcr.io/cubepals/blocklyd:<version>.
# Any other commit does nothing. Agents never push tags; this does.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/cubepals/blocklyd
      GH_TOKEN: ${{ github.token }}
      # The commit CI passed on, or main's head when run by hand.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Is this version released?
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$version" > /dev/null; then
            echo "v$version is out already."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: docker build -t "$IMAGE:${{ steps.version.outputs.version }}" .
      - name: The binary says its version, and the files
        if: steps.version.outputs.new == 'true'
        run: |
          version='${{ steps.version.outputs.version }}'
          [ "$(docker run --rm "$IMAGE:$version" --version)" = "blocklyd $version" ]
          mkdir -p dist
          id=$(docker create "$IMAGE:$version")
          for f in blocklyd openapi/node-reads.openapi.json openapi/node-writes.openapi.json \
                   deploy/daemon.json deploy/blocklyd.service LICENSE.md; do
            docker cp "$id:/$f" "dist/$(basename "$f")"
          done
          docker rm "$id" > /dev/null
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Push the image
        if: steps.version.outputs.new == 'true'
        id: push
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push -q "$IMAGE:${{ steps.version.outputs.version }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.version.outputs.version }}" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:${{ steps.version.outputs.version }}@$digest"
      - uses: actions/attest-build-provenance@v4
        if: steps.version.outputs.new == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v4
        if: steps.version.outputs.new == 'true'
        with:
          subject-path: dist/*
      # Drafted with every file, then published: an immutable release can't take files after.
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        run: |
          version='${{ steps.version.outputs.version }}'
          cat > notes.md <<NOTES
          blocklyd $version, under FSL-1.1-ALv2 (LICENSE.md).

          Image: \`$IMAGE:$version@${{ steps.push.outputs.digest }}\`

          Check a file or the image:
          \`\`\`sh
          gh attestation verify blocklyd -R ${{ github.repository }}
          gh attestation verify oci://$IMAGE:$version -R ${{ github.repository }}
          \`\`\`
          NOTES
          gh release create "v$version" dist/* --draft --target "$SHA" \
            --title "blocklyd $version" --notes-file notes.md
          gh release edit "v$version" --draft=false --latest
