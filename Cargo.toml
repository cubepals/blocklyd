[package]
name = "blocklyd"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "FSL-1.1-ALv2"
publish = false
repository = "https://github.com/cubepals/blocklyd"
description = "Cubepals' node daemon: runs Minecraft servers on a Linux host through Docker, for a control plane that places them."

[[bin]]
name = "blocklyd"
path = "src/main.rs"

[dependencies]
# Async runtime, HTTP server and middleware. axum is tokio's own router over hyper; the TLS accept
# loop is written by hand over tokio-rustls so the verified client certificate reaches handlers.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "http1", "tokio", "matched-path"] }
# The client side is for the node's own calls out: enrollment and heartbeats to the control plane,
# archives to and from presigned object-store URLs. One connection per call, no pool.
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.21", features = ["server", "server-graceful", "tokio", "service", "http1"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"

# TLS: rustls with the ring provider (no C/cmake toolchain beyond cc), mutual authentication.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "crypto"] }

# Docker Engine API client (unix socket, hyper 1).
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }

# Data, config, errors, CLI.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
# Archives in Blockly's existing format: a gzip tarball of the data directory.
tar = { version = "0.4", default-features = false }
flate2 = "1"
hex = "0.4"
# The join token is base64url JSON; bollard already brings this crate in.
base64 = "0.23"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
# Files replaced whole (durable.rs): a temp file beside each, named at random and made exclusively.
tempfile = "3"

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
prometheus-client = "0.25"

# Linux: kill a timed-out exec by host pid, statvfs for disk space, FICLONE, CLOCK_BOOTTIME.
rustix = { version = "1", features = ["fs", "process", "param", "time"] }
# adjtimex, which rustix doesn't wrap: whether the clock is synchronised (doctor).
libc = "0.2.189"
async-trait = "0.1"

[dev-dependencies]
# The control plane tests/fleet.rs stands in for reads the node's certificate requests.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "crypto", "x509-parser"] }
# The wire types' JSON Schema, which only the protocol's schema test reads (src/protocol/schema.rs):
# the control plane's TypeScript types are generated from it.
schemars = "=1.2.2"

[profile.release]
# A small, self-contained daemon: size and startup matter more than the last few percent.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
